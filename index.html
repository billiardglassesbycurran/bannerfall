<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b140c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bannerfall</title>
<link rel="stylesheet" href="src/style.css">
<script>
  // Show any error on screen so problems are visible on a phone (no dev tools there).
  window.addEventListener('error', function (e) {
    var d = document.getElementById('err'); if (!d) return;
    var src = e.target && e.target.src ? ' (failed to load ' + e.target.src + ')' : '';
    d.classList.remove('hide');
    d.textContent += 'Error: ' + (e.message || 'resource failed') + src + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '') + '\n';
  }, true);
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="box" class="hide"></div>
<div id="loading">Raising the banners…</div>

<!-- Command (aerial) view HUD -->
<div id="hud" class="hide">
  <div id="topbar"><span class="brand">BANNERFALL</span><span id="sel">No units selected</span><span id="ver"></span></div>
  <div id="cmd" class="bar">
    <button class="btn" id="bAll">Army<small>select all</small></button>
    <button class="btn hide" id="bClear">&#10005;<small>deselect</small></button>
    <button class="btn" id="bRide">&#9876; Ride<small>3rd person</small></button>
    <button class="btn" id="bLead">&#9873; Lead<small>as hero</small></button>
    <button class="btn" id="bFs">&#x26F6;<small>full</small></button>
  </div>
  <div id="help"></div>
</div>

<!-- 1st/3rd person HUD -->
<div id="pov" class="hide">
  <div id="joy" class="hide"><div id="knob"></div></div>
  <div id="xhair" class="hide"></div>
  <div id="pvname"></div>
  <div id="povbar" class="bar">
    <button class="btn" id="bExit">&#9873; Command<small>view</small></button>
    <button class="btn" id="bView">1st<small>person</small></button>
  </div>
  <div id="povhelp"></div>
</div>

<div id="err" class="hide"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
